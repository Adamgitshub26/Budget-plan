<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#202B33" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>Budgets</title>
<style>
  :root{
    --paper:#FBFAF7; --card:#FFFFFF; --ink:#202B33; --muted:#6B7680; --faint:#9AA2A8;
    --line:#E7E3DA; --lineSoft:#F0ECE3; --income:#2F7A63; --expense:#B0503A;
    --posBg:#EAF3EF; --posInk:#216551; --negBg:#F7ECE8; --negInk:#9B4430;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent;}
  .wrap{max-width:460px; margin:0 auto; padding:16px 12px 48px; padding-top:calc(16px + env(safe-area-inset-top));}
  h1{font-size:17px; font-weight:700; margin:0; letter-spacing:-.2px;}
  input{font-family:inherit;}
  input:focus{outline:2px solid var(--ink); outline-offset:-1px;}
  .ver{font-size:11px; font-family:var(--mono); color:var(--faint);}
  .btn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; font-family:inherit;}
  .btn:active{transform:translateY(1px);}
  .pill{flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .pill.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .pill.add{border-style:dashed; color:var(--muted); font-weight:400;}
  .seg{flex:1; padding:8px 10px; font-size:13px; font-weight:600; cursor:pointer; border:none; border-radius:8px; background:transparent; color:var(--muted);}
  .seg.on{background:var(--ink); color:#fff;}
  .row{display:flex; align-items:center; gap:6px; padding:9px 14px; border-top:1px solid var(--lineSoft);}
  .amt{width:96px; text-align:right; border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:15px; font-family:var(--mono); background:var(--card);}
  .namein{flex:1; min-width:0; border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:14px; background:var(--paper);}
  .mini{border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:5px; width:24px; height:22px; font-size:11px; line-height:1; cursor:pointer; padding:0;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px;}
  table{border-collapse:collapse; width:100%;}
  th,td{padding:7px 10px; font-size:13px; font-family:var(--mono); text-align:right; white-space:nowrap;}
  th{color:var(--muted); border-bottom:1px solid var(--line); font-size:12px;}
  td{border-bottom:1px solid var(--lineSoft);}
  .stick{position:sticky; left:0; z-index:2; background:var(--card); text-align:left; border-right:1px solid var(--line);}
  .overlay{position:fixed; inset:0; background:rgba(20,25,30,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--card); border-radius:14px; padding:18px; max-width:320px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,.25);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
const VERSION = "2.1";
const KEY = "budget:v1";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const keyOf = (y,m)=>`${y}-${String(m+1).padStart(2,"0")}`;
const fmt = (n)=>(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const isItem = (c)=>c.type!=="heading";
const labelOf = (k)=>{const [y,m]=k.split("-").map(Number); return `${MONTHS[m-1].slice(0,3)} ${String(y).slice(2)}`;};
const item = (id,name)=>({id,name,type:"item"});
const uid = ()=> "b"+Date.now().toString(36)+Math.floor(Math.random()*1000);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function makeHome(){
  const income=[item("i1","Income 1"),item("i2","Income 2"),item("i3","Income 3")];
  const expense=[["r","Rent"],["sc","sc"],["mad","mad"],["mostf","mostf"],["car","Car"],["hse","House ex"],["viol","viol"],["dnc","dnc"],["abs","abs"],["fb","fb"],["misc","Misc"],["pet","Pet"],["ln1","Loan 1"],["ln2","Loan 2"],["ch","ch"]].map(([i,n])=>item(i,n));
  const now=new Date(); const k=keyOf(now.getFullYear(),now.getMonth());
  const seed={i1:14500,i2:11000,i3:3500,r:3550,sc:4000,mad:500,mostf:2500,car:1000,hse:2750,viol:450,dnc:250,abs:700,fb:400,misc:1000,pet:450,ln1:1700,ln2:2500,ch:1000};
  return {id:"home",name:"Home",currency:"",categories:{income,expense},months:{[k]:seed}};
}
function makeBudget(name,inc,exp){
  return {id:uid(),name,currency:"",categories:{income:inc.map(n=>item(uid(),n)),expense:exp.map(n=>item(uid(),n))},months:{}};
}
function freshApp(){
  return {budgets:[makeHome(),makeBudget("Work",["Salary","Allowance"],["Transport","Food","Other"]),makeBudget("Money Sent",["Set aside"],["Family","Savings","Other"])],active:"home"};
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const p=JSON.parse(raw);
      if(Array.isArray(p.budgets)) return p;
      const home={id:"home",name:"Home",currency:p.currency||"",categories:p.categories,months:p.months};
      return {budgets:[home,makeBudget("Work",["Salary","Allowance"],["Transport","Food","Other"]),makeBudget("Money Sent",["Set aside"],["Family","Savings","Other"])],active:"home"};
    }
  }catch(e){}
  return freshApp();
}

// ---- state ----
let data = load();
let view = "month";
let editMode = false;
const today = new Date();
let ym = {y:today.getFullYear(), m:today.getMonth()};
let saveState = "idle";
let saveTimer = null;

function persist(){
  saveState="saving"; updateSaveLabel();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(data)); saveState="saved"; }
    catch(e){ saveState="idle"; }
    updateSaveLabel();
    setTimeout(()=>{ if(saveState==="saved"){saveState="idle"; updateSaveLabel();} },1400);
  },500);
}
function updateSaveLabel(){
  const el=document.getElementById("save"); if(!el) return;
  el.textContent = saveState==="saving"?"Saving…":saveState==="saved"?"Saved ✓":"Auto-saved";
  el.style.color = saveState==="saved"?"var(--income)":"var(--faint)";
}

// ---- derived ----
function activeBudget(){ return data.budgets.find(b=>b.id===data.active)||data.budgets[0]; }
function monthKey(){ return keyOf(ym.y, ym.m); }
function totOf(b,sect,k){ return b.categories[sect].reduce((s,c)=> s + (isItem(c)?(Number(b.months[k]&&b.months[k][c.id])||0):0),0); }

// ---- mutations ----
function setAmt(catId,val){
  const b=activeBudget(); const k=monthKey();
  if(!b.months[k]) b.months[k]={};
  if(val===""||isNaN(parseFloat(val))) delete b.months[k][catId]; else b.months[k][catId]=parseFloat(val);
  persist();
}
function setRowName(sect,id,name){ const b=activeBudget(); const c=b.categories[sect].find(x=>x.id===id); if(c){c.name=name; persist();} }
function removeRow(sect,id){ const b=activeBudget(); b.categories[sect]=b.categories[sect].filter(c=>c.id!==id); for(const k in b.months){ delete b.months[k][id]; } persist(); render(); }
function addRow(sect,type){ const b=activeBudget(); b.categories[sect].push({id:uid(),name:"",type}); persist(); render(); }
function move(sect,idx,dir){ const b=activeBudget(); const a=b.categories[sect]; const j=idx+dir; if(j<0||j>=a.length) return; [a[idx],a[j]]=[a[j],a[idx]]; persist(); render(); }
function setCurrency(v){ activeBudget().currency=v; persist(); refreshTotals(); }
function setBudgetName(v){ activeBudget().name=v; persist(); const p=document.getElementById("pill-"+data.active); if(p) p.textContent=v; }

function goto(delta){ let m=ym.m+delta,y=ym.y; while(m<0){m+=12;y--;} while(m>11){m-=12;y++;} ym={y,m}; render(); }
function copyToNextDo(y,m,nk){ const b=activeBudget(); b.months[nk]={...(b.months[monthKey()]||{})}; ym={y,m}; persist(); render(); }
function copyToNext(){
  let m=ym.m+1,y=ym.y; if(m>11){m=0;y++;} const nk=keyOf(y,m); const b=activeBudget();
  if(b.months[nk]&&Object.keys(b.months[nk]).length){ ask(`${MONTHS[m]} ${y} already has entries. Overwrite with this month's numbers?`,()=>copyToNextDo(y,m,nk)); return; }
  copyToNextDo(y,m,nk);
}
function copyFromPrev(){ let m=ym.m-1,y=ym.y; if(m<0){m=11;y--;} const pk=keyOf(y,m); const b=activeBudget(); b.months[monthKey()]={...(b.months[pk]||{})}; persist(); render(); }
function clearMonth(){ ask(`Clear all amounts for ${MONTHS[ym.m]} ${ym.y}?`,()=>{ activeBudget().months[monthKey()]={}; persist(); render(); }); }
function deleteMonth(){
  ask(`Delete ${MONTHS[ym.m]} ${ym.y} entirely? Your headings and rows stay — only this month's figures go.`,()=>{
    const b=activeBudget(); const k=monthKey(); delete b.months[k];
    const rem=Object.keys(b.months).filter(x=>x!==k&&Object.keys(b.months[x]).length).sort();
    if(rem.length){ const [y,m]=rem[rem.length-1].split("-").map(Number); ym={y,m:m-1}; }
    persist(); render();
  });
}
function addBudget(){ const nb=makeBudget("Budget "+(data.budgets.length+1),["Income 1"],["Expense 1"]); data.budgets.push(nb); data.active=nb.id; view="month"; editMode=true; persist(); render(); }
function switchBudget(id){ data.active=id; editMode=false; persist(); render(); }
function deleteBudget(){
  if(data.budgets.length<=1) return;
  const b=activeBudget();
  ask(`Delete the "${b.name}" budget and all its months? This can't be undone.`,()=>{
    data.budgets=data.budgets.filter(x=>x.id!==data.active); data.active=data.budgets[0].id; editMode=false; persist(); render();
  });
}

function exportCSV(){
  const b=activeBudget(); const keys=Object.keys(b.months).sort();
  const rows=[["Category",...keys]];
  const emit=(sect,label)=>{ rows.push([label]); b.categories[sect].forEach(c=>{ if(isItem(c)) rows.push([c.name||c.id,...keys.map(k=>(b.months[k]&&b.months[k][c.id]!=null)?b.months[k][c.id]:"")]); else rows.push(["— "+(c.name||"")]); }); };
  emit("income","INCOME"); rows.push(["Total income",...keys.map(k=>totOf(b,"income",k))]);
  emit("expense","EXPENSES"); rows.push(["Total expenses",...keys.map(k=>totOf(b,"expense",k))]);
  rows.push(["NET",...keys.map(k=>totOf(b,"income",k)-totOf(b,"expense",k))]);
  const csv=rows.map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  const a=document.createElement("a"); a.href=url; a.download=(b.name.replace(/\s+/g,"-").toLowerCase()||"budget")+"-budget.csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function exportBackup(){
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  const a=document.createElement("a"); a.href=url; const d=new Date();
  a.download=`budgets-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackup(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let p; try{ p=JSON.parse(rd.result); }catch(e){ note("That file isn't a valid backup."); return; }
      if(!p||!Array.isArray(p.budgets)||!p.budgets.length){ note("That file isn't a valid Budgets backup."); return; }
      ask("Import this backup? It will replace the budgets currently on this device.",()=>{
        data=p; if(!data.budgets.find(b=>b.id===data.active)) data.active=data.budgets[0].id;
        view="month"; editMode=false; persist(); render();
      });
    };
    rd.readAsText(f);
  });
  inp.click();
}
function note(message){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal"><p style="margin:0 0 16px;font-size:15px;line-height:1.4">${esc(message)}</p><div style="display:flex"><button class="btn" data-x="ok" style="flex:1">OK</button></div></div>`;
  ov.addEventListener("click",(e)=>{ if(e.target===ov||e.target.dataset.x==="ok") document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

function askInput(message,current,onSave){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal"><p style="margin:0 0 12px;font-size:15px;line-height:1.4">${esc(message)}</p>
    <input id="mi" inputmode="decimal" value="${current!=null?current:""}" placeholder="0" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;font-family:var(--mono);text-align:right;margin-bottom:14px">
    <div style="display:flex;gap:8px"><button class="btn" data-x="c" style="flex:1">Cancel</button><button class="btn" data-x="clr" style="flex:1;color:var(--expense)">Clear</button><button class="btn" data-x="s" style="flex:1;background:var(--ink);color:#fff;border:none;font-weight:600">Save</button></div></div>`;
  ov.addEventListener("click",(e)=>{ const x=e.target.dataset.x;
    if(e.target===ov||x==="c"){ document.body.removeChild(ov); }
    else if(x==="clr"){ document.body.removeChild(ov); onSave(null); }
    else if(x==="s"){ const v=ov.querySelector("#mi").value; document.body.removeChild(ov); const n=parseFloat(v); onSave(isNaN(n)?null:n); }
  });
  document.body.appendChild(ov);
  setTimeout(()=>{ const el=ov.querySelector("#mi"); if(el) el.focus(); },50);
}
function setTarget(){
  const b=activeBudget();
  askInput("Monthly savings target — the net (income − expenses) you want to reach each month:", b.target!=null?b.target:"", (v)=>{
    if(v==null) delete b.target; else b.target=v; persist(); render();
  });
}
function targetHTML(net,cur){
  const b=activeBudget();
  if(b.target==null){
    return `<button class="btn" style="width:100%;margin-bottom:16px;color:var(--muted)" data-action="set-target">＋ Set a monthly target</button>`;
  }
  const t=b.target;
  const done = net>=t;
  const pct = t>0 ? Math.max(0,Math.min(100,(net/t)*100)) : (net>=t?100:0);
  const diff = t-net;
  const statusText = done ? "Target achieved ✓" : `${cur}${fmt(Math.abs(diff))} to go`;
  const accent = done ? "var(--posInk)" : "var(--expense)";
  const barBg = done ? "var(--income)" : "var(--expense)";
  return `<div class="card" data-action="set-target" style="cursor:pointer;padding:12px 14px;margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-size:12px;letter-spacing:.6px;color:var(--muted);font-weight:600">TARGET · ${cur}${fmt(t)}</span>
      <span style="font-size:13px;font-weight:700;color:${accent}">${statusText}</span>
    </div>
    <div style="height:8px;border-radius:99px;background:var(--lineSoft);overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${barBg};border-radius:99px;transition:width .3s"></div>
    </div>
    <div style="font-size:11px;color:var(--faint);margin-top:6px;font-family:var(--mono)">${Math.round(pct)}% of target · tap to change</div>
  </div>`;
}

// ---- confirm modal ----
function ask(message,onYes){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal"><p style="margin:0 0 16px;font-size:15px;line-height:1.4">${esc(message)}</p><div style="display:flex;gap:8px"><button class="btn" data-x="c" style="flex:1">Cancel</button><button class="btn" data-x="y" style="flex:1;background:var(--expense);color:#fff;border:none;font-weight:600">Confirm</button></div></div>`;
  ov.addEventListener("click",(e)=>{ if(e.target===ov||e.target.dataset.x==="c"){ document.body.removeChild(ov); } else if(e.target.dataset.x==="y"){ document.body.removeChild(ov); onYes&&onYes(); } });
  document.body.appendChild(ov);
}

// ---- totals refresh (no re-render, keeps input focus) ----
function refreshTotals(){
  const b=activeBudget(); const md=b.months[monthKey()]||{}; const cur=b.currency?b.currency+" ":"";
  const inc=b.categories.income.reduce((s,c)=>s+(isItem(c)?(Number(md[c.id])||0):0),0);
  const exp=b.categories.expense.reduce((s,c)=>s+(isItem(c)?(Number(md[c.id])||0):0),0);
  const net=inc-exp;
  const set=(id,txt)=>{const el=document.getElementById(id); if(el) el.textContent=txt;};
  set("tot-income",cur+fmt(inc)); set("tot-expense",cur+fmt(exp));
  const nv=document.getElementById("net-val"); if(nv){ nv.textContent=(net<0?"−":"")+cur+fmt(Math.abs(net)); }
  set("net-sub",`${cur}${fmt(inc)} in · ${cur}${fmt(exp)} out`);
  const hero=document.getElementById("net-hero");
  if(hero){ hero.style.background=net>=0?"var(--posBg)":"var(--negBg)"; const col=net>=0?"var(--posInk)":"var(--negInk)"; hero.querySelectorAll("[data-nc]").forEach(e=>e.style.color=col); }
  const tw=document.getElementById("target-wrap"); if(tw) tw.innerHTML=targetHTML(net,cur);
}

// ---- render ----
function sectionHTML(sect,label,accent){
  const b=activeBudget(); const md=b.months[monthKey()]||{}; const cur=b.currency?b.currency+" ":"";
  const total=b.categories[sect].reduce((s,c)=>s+(isItem(c)?(Number(md[c.id])||0):0),0);
  let rows="";
  b.categories[sect].forEach((c,i)=>{
    const heading=!isItem(c);
    let left="";
    if(editMode){
      left += `<button class="mini" style="color:var(--expense);width:22px" data-action="remove-row" data-sect="${sect}" data-id="${c.id}">×</button>`;
      left += `<span style="display:flex;flex-direction:column;gap:2px"><button class="mini" style="height:14px" data-action="move" data-sect="${sect}" data-idx="${i}" data-dir="-1">▲</button><button class="mini" style="height:14px" data-action="move" data-sect="${sect}" data-idx="${i}" data-dir="1">▼</button></span>`;
      left += `<input class="namein" value="${esc(c.name)}" placeholder="${heading?'Heading':'Name'}" style="font-weight:${heading?700:400}" data-role="rowname" data-sect="${sect}" data-id="${c.id}">`;
    } else {
      const st = heading
        ? `flex:1;min-width:0;font-size:12px;letter-spacing:.6px;font-weight:700;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere;word-break:break-word`
        : `flex:1;min-width:0;font-size:15px;color:var(--ink);overflow-wrap:anywhere;word-break:break-word;line-height:1.3`;
      left += `<span style="${st}">${esc(c.name|| (heading?'Heading':c.id))}</span>`;
    }
    const amtin = heading ? "" : `<input class="amt" inputmode="decimal" value="${md[c.id]!=null?md[c.id]:""}" placeholder="0" style="color:${accent};width:${editMode?78:96}px" data-role="amount" data-cat="${c.id}">`;
    const bg = heading&&!editMode ? "background:var(--paper);" : "";
    rows += `<div class="row" style="${bg}padding:${heading?'8px 14px':'9px 14px'}">${left}${amtin}</div>`;
  });
  let addr="";
  if(editMode){
    addr = `<div style="display:flex;border-top:1px solid var(--lineSoft)">
      <button class="btn" style="flex:1;border-radius:0;border:none;color:${accent};padding:10px" data-action="add-row" data-sect="${sect}" data-type="item">+ Add ${sect==="income"?"income":"expense"}</button>
      <button class="btn" style="flex:1;border-radius:0;border:none;border-left:1px solid var(--lineSoft);color:var(--muted);padding:10px" data-action="add-row" data-sect="${sect}" data-type="heading">+ Add heading</button></div>`;
  }
  return `<div class="card" style="overflow:hidden;margin-bottom:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--paper)">
      <span style="font-size:12px;letter-spacing:.6px;color:var(--muted);font-weight:600">${label}</span>
      <span id="tot-${sect}" style="font-family:var(--mono);font-size:15px;font-weight:600;color:${accent}">${cur}${fmt(total)}</span>
    </div>${rows}${addr}</div>`;
}

function summaryHTML(){
  const b=activeBudget();
  const withData=Object.keys(b.months).filter(k=>Object.keys(b.months[k]).length).sort();
  const cols=Array.from(new Set([...withData,monthKey()])).sort();
  const head=`<tr><th class="stick">Category</th>${cols.map(k=>`<th style="cursor:pointer;${k===monthKey()?'color:var(--ink);font-weight:700':'font-weight:500'}" data-action="summary-open-month" data-key="${k}">${labelOf(k)}</th>`).join("")}</tr>`;
  const dataRow=(c,accent)=>`<tr><td class="stick" style="color:var(--ink)">${esc(c.name||c.id)}</td>${cols.map(k=>{const v=b.months[k]&&b.months[k][c.id]; return `<td style="color:${v!=null?accent:'var(--faint)'}">${v!=null?fmt(v):""}</td>`;}).join("")}</tr>`;
  const headRow=(name)=>`<tr><td class="stick" style="background:var(--paper);font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;color:var(--muted)">${esc(name||' ')}</td>${cols.map(()=>`<td style="background:var(--paper)"></td>`).join("")}</tr>`;
  const totRow=(label,get,strong,color)=>`<tr><td class="stick" style="font-weight:700;background:${strong?'var(--posBg)':'var(--paper)'};color:${color||'var(--ink)'}">${label}</td>${cols.map(k=>{const v=get(k); const c= strong?(v>=0?'var(--posInk)':'var(--negInk)'):(color||'var(--ink)'); const bg= strong?(v>=0?'var(--posBg)':'var(--negBg)'):'var(--paper)'; return `<td style="font-weight:700;color:${c};background:${bg}">${v<0?"−":""}${fmt(Math.abs(v))}</td>`;}).join("")}</tr>`;
  let body="";
  body+=headRow("Income");
  b.categories.income.forEach(c=> body+= isItem(c)?dataRow(c,"var(--income)"):headRow(c.name));
  body+=totRow("Total income",k=>totOf(b,"income",k),false,"var(--income)");
  body+=headRow("Expenses");
  b.categories.expense.forEach(c=> body+= isItem(c)?dataRow(c,"var(--expense)"):headRow(c.name));
  body+=totRow("Total expenses",k=>totOf(b,"expense",k),false,"var(--expense)");
  body+=totRow("NET",k=>totOf(b,"income",k)-totOf(b,"expense",k),true);
  return `<div class="card" style="overflow:auto;-webkit-overflow-scrolling:touch"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 2px 16px;line-height:1.5">Scroll sideways for all months. Tap a month header to open it for editing.</p>
    <button class="btn" style="width:100%" data-action="export">Export CSV</button>`;
}

function render(){
  const b=activeBudget(); const md=b.months[monthKey()]||{}; const cur=b.currency?b.currency+" ":"";
  const inc=b.categories.income.reduce((s,c)=>s+(isItem(c)?(Number(md[c.id])||0):0),0);
  const exp=b.categories.expense.reduce((s,c)=>s+(isItem(c)?(Number(md[c.id])||0):0),0);
  const net=inc-exp;
  const monthEmpty=Object.keys(md).length===0;
  const anyData=Object.keys(b.months).some(k=>Object.keys(b.months[k]).length);

  const pills = data.budgets.map(bd=>`<button class="pill ${bd.id===b.id?'on':''}" id="pill-${bd.id}" data-action="switch-budget" data-id="${bd.id}">${esc(bd.name)}</button>`).join("")
    + `<button class="pill add" data-action="add-budget">＋ New</button>`;

  let main="";
  if(view==="summary"){ main=summaryHTML(); }
  else{
    main = `
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;margin-bottom:14px">
      <button class="btn" style="padding:6px 12px;font-size:18px;line-height:1" data-action="nav" data-delta="-1">‹</button>
      <div style="text-align:center"><div style="font-size:16px;font-weight:700">${MONTHS[ym.m]}</div><div style="font-size:12px;color:var(--muted);font-family:var(--mono)">${ym.y}</div></div>
      <button class="btn" style="padding:6px 12px;font-size:18px;line-height:1" data-action="nav" data-delta="1">›</button>
    </div>
    <div id="net-hero" style="border-radius:14px;padding:16px 18px;margin-bottom:16px;background:${net>=0?'var(--posBg)':'var(--negBg)'}">
      <div data-nc style="font-size:12px;letter-spacing:.6px;font-weight:600;margin-bottom:2px;color:${net>=0?'var(--posInk)':'var(--negInk)'}">NET · income − expenses</div>
      <div id="net-val" data-nc style="font-family:var(--mono);font-size:34px;font-weight:700;line-height:1.1;color:${net>=0?'var(--posInk)':'var(--negInk)'}">${net<0?"−":""}${cur}${fmt(Math.abs(net))}</div>
      <div id="net-sub" style="font-size:13px;color:var(--muted);margin-top:6px;font-family:var(--mono)">${cur}${fmt(inc)} in · ${cur}${fmt(exp)} out</div>
    </div>
    <div id="target-wrap">${targetHTML(net,cur)}</div>
    ${(monthEmpty&&anyData)?`<button class="btn" style="width:100%;margin-bottom:14px;color:var(--income);border-color:var(--income)" data-action="copy-prev">Copy last month's figures into ${MONTHS[ym.m]}</button>`:""}
    ${sectionHTML("income","INCOME","var(--income)")}
    ${sectionHTML("expense","EXPENSES","var(--expense)")}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">
      <button class="btn" style="flex:1 1 100%;background:var(--ink);color:#fff;border:none;font-weight:600;padding:11px" data-action="copy-next">Carry to next month →</button>
      <button class="btn" style="flex:1 1 45%;font-weight:600;${editMode?'background:var(--ink);color:#fff;border:none':''}" data-action="toggle-edit">${editMode?"Done":"Edit rows"}</button>
      <button class="btn" style="flex:1 1 45%" data-action="export">Export CSV</button>
      <button class="btn" style="flex:1 1 45%;color:var(--expense)" data-action="clear-month">Clear month</button>
      <button class="btn" style="flex:1 1 45%;color:var(--expense)" data-action="delete-month">Delete month</button>
    </div>
    ${editMode?`<div class="card" style="padding:12px;margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:10px"><span>Currency label</span><input value="${esc(b.currency)}" placeholder="e.g. ₹, $, AED" style="border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:110px" data-role="currency"></div>
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:12px"><span>Budget name</span><input value="${esc(b.name)}" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-weight:600" data-role="budgetname"></div>
      <button class="btn" style="width:100%;color:${data.budgets.length<=1?'var(--faint)':'var(--expense)'}" data-action="delete-budget" ${data.budgets.length<=1?'disabled':''}>${data.budgets.length<=1?"Delete this budget (keep at least one)":"Delete this budget"}</button>
    </div>`:""}`;
  }

  document.getElementById("app").innerHTML = `
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">
      <div style="display:flex;align-items:baseline;gap:8px"><h1>Budgets</h1><span class="ver">v${VERSION}</span></div>
      <span id="save" style="font-size:12px;color:var(--faint)">Auto-saved</span>
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px">${pills}</div>
    <div class="card" style="display:flex;gap:4px;padding:4px;margin-bottom:14px">
      <button class="seg ${view==='month'?'on':''}" data-action="view" data-view="month">Month</button>
      <button class="seg ${view==='summary'?'on':''}" data-action="view" data-view="summary">Summary</button>
    </div>
    ${main}
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" style="flex:1" data-action="backup">Backup all</button>
      <button class="btn" style="flex:1" data-action="import">Import backup</button>
    </div>
    <p style="font-size:12px;color:var(--faint);margin-top:12px;line-height:1.5">Works offline; everything saves to this device. <b>Backup all</b> saves a file of every budget — keep it safe or move it to another device with <b>Import backup</b>. <b>Export CSV</b> opens the current budget in Excel.</p>`;
  updateSaveLabel();
}

// ---- event delegation ----
const app=document.getElementById("app");
app.addEventListener("click",(e)=>{
  const t=e.target.closest("[data-action]"); if(!t) return;
  const a=t.dataset.action;
  if(a==="switch-budget") switchBudget(t.dataset.id);
  else if(a==="add-budget") addBudget();
  else if(a==="view"){ view=t.dataset.view; render(); }
  else if(a==="nav") goto(parseInt(t.dataset.delta,10));
  else if(a==="toggle-edit"){ editMode=!editMode; render(); }
  else if(a==="copy-next") copyToNext();
  else if(a==="copy-prev") copyFromPrev();
  else if(a==="clear-month") clearMonth();
  else if(a==="delete-month") deleteMonth();
  else if(a==="set-target") setTarget();
  else if(a==="export") exportCSV();
  else if(a==="backup") exportBackup();
  else if(a==="import") importBackup();
  else if(a==="add-row") addRow(t.dataset.sect,t.dataset.type);
  else if(a==="remove-row") removeRow(t.dataset.sect,t.dataset.id);
  else if(a==="move") move(t.dataset.sect,parseInt(t.dataset.idx,10),parseInt(t.dataset.dir,10));
  else if(a==="delete-budget") deleteBudget();
  else if(a==="summary-open-month"){ const [y,m]=t.dataset.key.split("-").map(Number); ym={y,m:m-1}; view="month"; render(); }
});
app.addEventListener("input",(e)=>{
  const r=e.target.dataset.role; if(!r) return;
  if(r==="amount"){ setAmt(e.target.dataset.cat, e.target.value); refreshTotals(); }
  else if(r==="rowname") setRowName(e.target.dataset.sect,e.target.dataset.id,e.target.value);
  else if(r==="currency") setCurrency(e.target.value);
  else if(r==="budgetname") setBudgetName(e.target.value);
});

render();

// ---- offline service worker ----
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
}
</script>
</body>
</html>
